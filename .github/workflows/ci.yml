name: ModelDock CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.26.6
  NODE_VERSION: 22.22.3

jobs:
  go:
    name: Go format, vet, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Set up Node.js for the pinned evidence validator
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/commercial-evidence/package-lock.json
      - name: Install the repository-locked evidence validator
        working-directory: tools/commercial-evidence
        run: npm ci --ignore-scripts
      - name: Verify gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal migrations tests/backend)"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
      - name: Verify exact money and generated release status
        shell: pwsh
        run: |
          ./scripts/verify-exact-money.ps1
          ./tests/release/verify-commercial-readiness.ps1
          ./scripts/update-readme-commercial-status.ps1 -Check
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 -timeout=300s ./...

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [admin-web, console-web]
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Install locked dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm ci
      - name: Lint
        working-directory: apps/${{ matrix.app }}
        run: npm run lint
      - name: Typecheck
        working-directory: apps/${{ matrix.app }}
        run: npm run typecheck
      - name: Test when defined
        working-directory: apps/${{ matrix.app }}
        run: npm run test --if-present
      - name: Build
        working-directory: apps/${{ matrix.app }}
        run: npm run build
      - name: Audit high-severity dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm audit --audit-level=high

  dependency-security:
    name: Dependency vulnerability scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Scan reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
      - name: Run Go SAST
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.10
          gosec -exclude-generated ./...
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Audit locked frontend dependencies
        shell: bash
        run: |
          npm --prefix apps/admin-web ci
          npm --prefix apps/admin-web audit --audit-level=high
          npm --prefix apps/console-web ci
          npm --prefix apps/console-web audit --audit-level=high
          npm --prefix tools/commercial-evidence ci --ignore-scripts
          npm --prefix tools/commercial-evidence audit --audit-level=high
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Reject tracked local environments
        shell: bash
        run: test -z "$(git ls-files '.env' '.env.*' | grep -v '^.env.example$' || true)"
      - name: Scan commits for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  workflow-security:
    name: Actionlint and workflow permission audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install checksum-verified Actionlint 1.7.7
        shell: bash
        run: |
          curl --fail --location --silent --show-error --output /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tar.gz' | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -version
      - name: Validate workflow syntax
        run: /tmp/actionlint
      - name: Audit Action pins and permission scopes
        shell: pwsh
        run: ./scripts/verify-workflow-security.ps1
      - name: Test exact annotated release Tag contract
        shell: pwsh
        run: ./tests/release/verify-release-tag.ps1

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create ephemeral non-production configuration
        shell: pwsh
        run: ./scripts/new-ci-env.ps1 -OutputPath .cache/ci.env
      - name: Validate development and mock profiles
        run: |
          docker compose --env-file .cache/ci.env config --quiet
          docker compose --env-file .cache/ci.env --profile mock-openai config --quiet
      - name: Validate production model
        run: docker compose --env-file .cache/ci.env -f docker-compose.production.yml config --quiet

  docker:
    name: Reproducible Docker build and image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Buildx for reproducible OCI exports
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Verify server image reproducibility and source metadata
        shell: pwsh
        run: ./tests/integration/verify-release-metadata.ps1 -Commit $env:GITHUB_SHA -VerifyReproducible
      - name: Capture deterministic source metadata
        id: source
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          test -n "$version"
          {
            echo "version=$version"
            echo "build_date=$(git show -s --format=%cI "$GITHUB_SHA" | xargs -I{} date -u -d '{}' +%Y-%m-%dT%H:%M:%SZ)"
            echo "source_epoch=$(git show -s --format=%ct "$GITHUB_SHA")"
          } >> "$GITHUB_OUTPUT"
      - name: Build final CI images
        shell: bash
        run: |
          mkdir -p .cache
          common=(--build-arg VERSION="${{ steps.source.outputs.version }}" --build-arg COMMIT="$GITHUB_SHA" --build-arg BUILD_DATE="${{ steps.source.outputs.build_date }}" --build-arg SOURCE_DATE_EPOCH="${{ steps.source.outputs.source_epoch }}")
          docker build -f deploy/docker/Dockerfile.relaydock "${common[@]}" -t "modeldock/ci-server:$GITHUB_SHA" .
          docker build -f deploy/docker/Dockerfile.admin-web "${common[@]}" -t "modeldock/ci-admin-web:$GITHUB_SHA" .
          docker build -f deploy/docker/Dockerfile.console-web "${common[@]}" -t "modeldock/ci-console-web:$GITHUB_SHA" .
      - name: Verify all candidate images run as non-root
        shell: bash
        run: |
          test "$(docker image inspect "modeldock/ci-server:$GITHUB_SHA" --format '{{.Config.User}}')" = '10001:10001'
          test "$(docker image inspect "modeldock/ci-admin-web:$GITHUB_SHA" --format '{{.Config.User}}')" = '101:101'
          test "$(docker image inspect "modeldock/ci-console-web:$GITHUB_SHA" --format '{{.Config.User}}')" = '101:101'
      - name: Generate Server SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: modeldock/ci-server:${{ github.sha }}
          format: spdx-json
          output-file: .cache/server.spdx.json
          upload-artifact: false
      - name: Generate Admin SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: modeldock/ci-admin-web:${{ github.sha }}
          format: spdx-json
          output-file: .cache/admin.spdx.json
          upload-artifact: false
      - name: Generate Console SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: modeldock/ci-console-web:${{ github.sha }}
          format: spdx-json
          output-file: .cache/console.spdx.json
          upload-artifact: false
      - name: Scan server image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: modeldock/ci-server:${{ github.sha }}
          format: table
          exit-code: 1
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Scan admin image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: modeldock/ci-admin-web:${{ github.sha }}
          format: table
          exit-code: 1
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Scan console image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: modeldock/ci-console-web:${{ github.sha }}
          format: table
          exit-code: 1
          vuln-type: os,library
          severity: CRITICAL,HIGH

  migrations:
    name: Empty and populated upgrade migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Create ephemeral non-production configuration
        shell: pwsh
        run: ./scripts/new-ci-env.ps1 -OutputPath .cache/ci.env
      - name: Prepare isolated bind directories
        run: mkdir -p data/postgres data/redis data/cockpit logs
      - name: Start isolated PostgreSQL
        run: docker compose --env-file .cache/ci.env up -d --wait --wait-timeout 120 postgres
      - name: Build migration test image from this commit
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          build_date="$(git show -s --format=%cI "$GITHUB_SHA" | xargs -I{} date -u -d '{}' +%Y-%m-%dT%H:%M:%SZ)"
          source_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          test -n "$version"
          docker build -f deploy/docker/Dockerfile.relaydock \
            --build-arg VERSION="$version" --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$build_date" --build-arg SOURCE_DATE_EPOCH="$source_epoch" \
            -t relaydock/server:local .
      - name: Verify empty and populated V1 upgrade paths
        shell: pwsh
        run: ./tests/integration/verify-migrations.ps1 -EnvFile .cache/ci.env -ConfirmIsolatedTestDatabase
      - name: Collect safe service state on failure
        if: failure()
        run: docker compose --env-file .cache/ci.env ps
      - name: Stop isolated services
        if: always()
        run: docker compose --env-file .cache/ci.env down --remove-orphans

  commercial-integration:
    name: Commercial and Marketplace integration gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Set up Node.js for signed evidence tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/commercial-evidence/package-lock.json
      - name: Install the repository-locked evidence validator
        working-directory: tools/commercial-evidence
        run: npm ci --ignore-scripts
      - name: Create isolated test configuration
        shell: pwsh
        run: ./scripts/new-ci-env.ps1 -OutputPath .env
      - name: Prepare isolated bind and result directories
        run: mkdir -p data/postgres data/redis data/cockpit logs .cache/commercial-results .cache/ci-candidates
      - name: Start isolated PostgreSQL and Redis
        run: docker compose --env-file .env up -d --wait --wait-timeout 120 postgres redis
      - name: Build exact-commit integration images once
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          build_date="$(git show -s --format=%cI "$GITHUB_SHA" | xargs -I{} date -u -d '{}' +%Y-%m-%dT%H:%M:%SZ)"
          source_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          docker build -f deploy/docker/Dockerfile.relaydock \
            --build-arg VERSION="$version" --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$build_date" --build-arg SOURCE_DATE_EPOCH="$source_epoch" \
            -t relaydock/server:local .
          docker build -f deploy/docker/Dockerfile.admin-web \
            --build-arg VERSION="$version" --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$build_date" --build-arg SOURCE_DATE_EPOCH="$source_epoch" \
            -t relaydock/admin-web:local .
          docker build -f deploy/docker/Dockerfile.console-web \
            --build-arg VERSION="$version" --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$build_date" --build-arg SOURCE_DATE_EPOCH="$source_epoch" \
            -t relaydock/console-web:local .
      - name: Verify the exact integration images run as non-root
        shell: bash
        run: |
          test "$(docker image inspect relaydock/server:local --format '{{.Config.User}}')" = '10001:10001'
          test "$(docker image inspect relaydock/admin-web:local --format '{{.Config.User}}')" = '101:101'
          test "$(docker image inspect relaydock/console-web:local --format '{{.Config.User}}')" = '101:101'
      - name: Generate same-Digest Server SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: relaydock/server:local
          format: spdx-json
          output-file: .cache/ci-candidates/sbom-server.spdx.json
          upload-artifact: false
      - name: Generate same-Digest Admin SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: relaydock/admin-web:local
          format: spdx-json
          output-file: .cache/ci-candidates/sbom-admin.spdx.json
          upload-artifact: false
      - name: Generate same-Digest Console SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: relaydock/console-web:local
          format: spdx-json
          output-file: .cache/ci-candidates/sbom-console.spdx.json
          upload-artifact: false
      - name: Trivy same-Digest Server image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: relaydock/server:local
          format: table
          exit-code: 1
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Trivy same-Digest Admin image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: relaydock/admin-web:local
          format: table
          exit-code: 1
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Trivy same-Digest Console image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: relaydock/console-web:local
          format: table
          exit-code: 1
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Record same-Digest engineering candidate metadata and provenance
        shell: pwsh
        run: |
          $images = [ordered]@{ server='relaydock/server:local'; admin='relaydock/admin-web:local'; console='relaydock/console-web:local' }
          foreach ($component in $images.Keys) {
            $digest = (docker image inspect $images[$component] --format '{{.Id}}').Trim()
            if ($digest -notmatch '^sha256:[0-9a-f]{64}$') { throw "Invalid $component image Digest." }
            [ordered]@{
              predicate_type='https://slsa.dev/provenance/v1'
              evidence_level='ENGINEERING_CI'
              repository=$env:GITHUB_REPOSITORY
              commit=$env:GITHUB_SHA
              image_digest=$digest
              workflow_run_id=$env:GITHUB_RUN_ID
              workflow_run_attempt=$env:GITHUB_RUN_ATTEMPT
            } | ConvertTo-Json | Set-Content ".cache/ci-candidates/provenance-$component.json" -Encoding utf8
            [ordered]@{
              component=$component
              evidence_level='ENGINEERING_CI'
              repository=$env:GITHUB_REPOSITORY
              workflow_run_id=$env:GITHUB_RUN_ID
              workflow_run_attempt=$env:GITHUB_RUN_ATTEMPT
              digest=$digest
              commit=$env:GITHUB_SHA
              candidate_tag="local-$($env:GITHUB_SHA.Substring(0,12))"
              candidate_tag_digest=$digest
              scan_status='PASS'; scan_digest=$digest; scan_commit=$env:GITHUB_SHA
              sbom_status='PASS'; sbom_digest=$digest; sbom_commit=$env:GITHUB_SHA
              provenance_status='PASS'; provenance_digest=$digest; provenance_commit=$env:GITHUB_SHA
            } | ConvertTo-Json | Set-Content ".cache/ci-candidates/image-$component.json" -Encoding utf8
          }
      - name: Run every commercial and Marketplace suite
        shell: pwsh
        run: ./scripts/verify-commercial-integration.ps1 -EnvFile .env -ConfirmIsolatedTestDatabase -OutputDirectory .cache/commercial-results -ServerImage relaydock/server:local -AdminImage relaydock/admin-web:local -ConsoleImage relaydock/console-web:local -CandidateMetadataDirectory .cache/ci-candidates
      - name: Generate and verify exact-commit engineering reports
        shell: pwsh
        run: |
          ./scripts/verify-commercial-readiness.ps1 -Profile ENGINEERING_PREVIEW -Commit $env:GITHUB_SHA -TestReportPath .cache/commercial-results/commercial-test-evidence.json -ReportOutput .cache/commercial-results/commercial-readiness-report.md -GoLiveOutput .cache/commercial-results/go-live-checklist.md -SecurityReportOutput .cache/commercial-results/security-release-report.md -FinancialReportOutput .cache/commercial-results/financial-reconciliation-report.md -ImageDigestReportOutput .cache/commercial-results/image-digest-report.md
          $report = Get-Content -LiteralPath .cache/commercial-results/go-live-checklist.md -Raw
          if ($report -notmatch [regex]::Escape("- Commit: $env:GITHUB_SHA")) { throw 'Generated Go-live Report commit does not equal HEAD.' }
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Checkout HEAD changed during commercial verification.' }
      - name: Collect safe service state on failure
        if: failure()
        run: docker compose --env-file .env ps > .cache/commercial-results/compose-state.txt
      - name: Upload exact-commit commercial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commercial-integration-${{ github.sha }}
          path: |
            .cache/commercial-results
            .cache/ci-candidates
          if-no-files-found: error
          retention-days: 30
      - name: Stop isolated services
        if: always()
        run: docker compose --env-file .env down --remove-orphans

  go-format-required:
    name: Go Format
    needs: go
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.go.result }}' = success
  go-vet-required:
    name: Go Vet
    needs: go
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.go.result }}' = success
  go-test-required:
    name: Go Test
    needs: go
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.go.result }}' = success
  frontend-admin-required:
    name: Frontend Admin
    needs: frontend
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.frontend.result }}' = success
  frontend-console-required:
    name: Frontend Console
    needs: frontend
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.frontend.result }}' = success
  exact-money-required:
    name: Exact Money
    needs: go
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.go.result }}' = success
  migration-required:
    name: Migration 1–25
    needs: migrations
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.migrations.result }}' = success
  commercial-required:
    name: Commercial Integration
    needs: commercial-integration
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.commercial-integration.result }}' = success
  marketplace-required:
    name: Marketplace Integration
    needs: commercial-integration
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.commercial-integration.result }}' = success
  evidence-schema-required:
    name: Evidence Schema
    needs: commercial-integration
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.commercial-integration.result }}' = success
  evidence-signature-required:
    name: Evidence Signature
    needs: commercial-integration
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.commercial-integration.result }}' = success
  runtime-attestation-required:
    name: Runtime Attestation
    needs: commercial-integration
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.commercial-integration.result }}' = success
  release-negative-required:
    name: Release Negative Tests
    needs: commercial-integration
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.commercial-integration.result }}' = success
  docker-build-required:
    name: Docker Build
    needs: commercial-integration
