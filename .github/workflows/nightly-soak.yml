name: ModelDock Nightly Commercial Soak

on:
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: Bounded soak duration in minutes
        required: true
        default: '180'

permissions:
  contents: read

concurrency:
  group: nightly-commercial-soak
  cancel-in-progress: false

env:
  GO_VERSION: 1.26.6

jobs:
  soak:
    name: Wallet, streaming, fault, and settlement soak
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Create isolated configuration and directories
        shell: pwsh
        run: |
          if ((git status --porcelain).Count -ne 0) { throw 'Nightly formal test checkout must be clean.' }
          ./scripts/new-ci-env.ps1 -OutputPath .env
          New-Item -ItemType Directory -Force data/postgres,data/redis,data/cockpit,logs,.cache/nightly-soak | Out-Null
      - name: Build and start exact-commit test topology
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          build_date="$(git show -s --format=%cI "$GITHUB_SHA" | xargs -I{} date -u -d '{}' +%Y-%m-%dT%H:%M:%SZ)"
          source_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          docker build -f deploy/docker/Dockerfile.relaydock \
            --build-arg VERSION="$version" --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$build_date" --build-arg SOURCE_DATE_EPOCH="$source_epoch" \
            -t relaydock/server:local .
          docker compose --env-file .env up -d --wait --wait-timeout 120 postgres redis
      - name: Repeated ordinary, SSE, wallet, upstream-fault, restart, price, webhook, and settlement scenarios
        shell: pwsh
        env:
          REQUESTED_DURATION: ${{ inputs.duration_minutes || '180' }}
        run: |
          $minutes = [int]$env:REQUESTED_DURATION
          if ($minutes -lt 30 -or $minutes -gt 240) { throw 'duration_minutes must be between 30 and 240.' }
          $deadline = [DateTimeOffset]::UtcNow.AddMinutes($minutes)
          $iteration = 0
          do {
            $iteration++
            $log = ".cache/nightly-soak/iteration-$iteration.log"
            try {
              ./tests/integration/verify-commercial-onboarding.ps1 -ConfirmIsolatedTestDatabase -StartupTimeoutSeconds 180 -ExistingServerImage relaydock/server:local *>&1 | Tee-Object $log
              ./tests/integration/verify-funding.ps1 -EnvFile .env -ConfirmIsolatedTestDatabase *>&1 | Tee-Object -Append $log
              ./tests/integration/verify-payments.ps1 -EnvFile .env *>&1 | Tee-Object -Append $log
              ./tests/integration/verify-marketplace-launch.ps1 -EnvFile .env -GoExecutable go -ConfirmIsolatedTestDatabase *>&1 | Tee-Object -Append $log
            } catch {
              $_ | Out-String | Add-Content $log
              throw
            }
          } while ([DateTimeOffset]::UtcNow -lt $deadline)
          $digest = (docker image inspect relaydock/server:local --format '{{.Id}}').Trim()
          $migration = (Get-ChildItem migrations -File -Filter '*.sql' | Where-Object BaseName -Match '^[0-9]{4}_[a-z0-9_]+$' | Sort-Object BaseName | Select-Object -Last 1).BaseName
          [ordered]@{
            schema_version='2.0.0'; evidence_classification='NOT_RELEASE_EVIDENCE'; repository=$env:GITHUB_REPOSITORY; commit_sha=$env:GITHUB_SHA
            tree_sha=(git rev-parse 'HEAD^{tree}').Trim(); migration_version=$migration
            version=(Get-Content VERSION -Raw).Trim(); workflow_run_id=$env:GITHUB_RUN_ID; workflow_run_attempt=$env:GITHUB_RUN_ATTEMPT; branch_or_tag="branch/$($env:GITHUB_REF_NAME)"
            server_image_digest=$digest; iterations=$iteration; completed_at=[DateTimeOffset]::UtcNow.ToString('o'); status='PASS'
          } |
            ConvertTo-Json | Set-Content .cache/nightly-soak/summary.json -Encoding utf8
      - name: Collect safe service state on failure
        if: failure()
        run: docker compose --env-file .env ps > .cache/nightly-soak/compose-state.txt
      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-soak-${{ github.sha }}-${{ github.run_id }}
          path: .cache/nightly-soak
          if-no-files-found: error
          retention-days: 30
      - name: Stop isolated services
        if: always()
        run: docker compose --env-file .env down --remove-orphans
