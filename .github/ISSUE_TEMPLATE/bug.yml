name: Bug report
description: Report a reproducible ModelDock defect using synthetic data.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or include secrets/customer data here. Use the private security advisory link instead.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `relaydock --version` or the full image digest.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Gateway /v1, Control API, Admin web, Console web, Database migration, Docker / deployment, Documentation]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use only synthetic requests, identifiers, and redacted logs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Docker/Compose versions, deployment topology, and relevant non-secret configuration.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I removed API keys, credentials, personal data, prompt/response content, and production logs.
          required: true
        - label: This is not a security vulnerability report.
          required: true
