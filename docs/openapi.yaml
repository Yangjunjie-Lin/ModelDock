      responses: { '200': { description: Exact-decimal payable summaries } }
  /api/console/suppliers/{supplierID}/payables:
    get:
      tags: [Console, Supplier Settlement]
      summary: List immutable platform usage accruals
      security: [{ consoleSessionCookie: [] }, { controlBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/SupplierID' }]
      responses: { '200': { description: Platform-derived payable accruals } }
  /api/console/suppliers/{supplierID}/settlements:
    get:
      tags: [Console, Supplier Settlement]
      summary: List supplier settlement batches
      security: [{ consoleSessionCookie: [] }, { controlBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/SupplierID' }]
      responses: { '200': { description: Settlement batches } }
  /api/console/suppliers/{supplierID}/settlements/{batchID}:
    get:
      tags: [Console, Supplier Settlement]
      summary: Read a supplier-owned settlement with immutable items
      security: [{ consoleSessionCookie: [] }, { controlBearer: [] }]
      parameters:
        - { $ref: '#/components/parameters/SupplierID' }
        - { name: batchID, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Settlement batch and item evidence }, '404': { description: Not found outside the owned supplier scope } }
  /api/console/suppliers/{supplierID}/bills:
    get:
      tags: [Console, Supplier Settlement]
      summary: List supplier-declared bills
      security: [{ consoleSessionCookie: [] }, { controlBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/SupplierID' }]
      responses: { '200': { description: Supplier bills and reconciliation status } }
    post:
      tags: [Console, Supplier Settlement]
      summary: Import an immutable supplier bill declaration
      description: A supplier bill is reconciliation evidence only and never creates payable usage or authorizes payout.
      security: [{ consoleSessionCookie: [] }, { controlBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/SupplierID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SupplierBillWrite' } } } }
      responses: { '201': { description: Supplier declaration imported }, '200': { description: Exact idempotent replay } }
  /api/console/suppliers/{supplierID}/appeals:
    get:
      tags: [Console, Supplier Settlement]
      summary: List supplier appeals
      security: [{ consoleSessionCookie: [] }, { controlBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/SupplierID' }]
      responses: { '200': { description: Supplier appeals } }
    post:
      tags: [Console, Supplier Settlement]
      summary: Dispute platform usage or an unpaid settlement
      description: An open usage or settlement appeal blocks the related payout.
      security: [{ consoleSessionCookie: [] }, { controlBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/SupplierID' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SupplierAppealWrite' } } } }
      responses: { '201': { description: Appeal submitted and payout blocked } }
  /api/admin/supplier-payables:
    get:
      tags: [Admin, Supplier Settlement]
      summary: List platform-measured supplier payable accruals
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      responses: { '200': { description: Payable accruals } }
  /api/admin/supplier-payables/{id}/refund-share:
    post:
      tags: [Admin, Supplier Settlement]
      summary: Allocate an audited supplier refund share
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [amount, reference, idempotency_key], properties: { amount: { $ref: '#/components/schemas/ExactDecimal' }, reference: { type: string }, idempotency_key: { type: string } } } } } }
      responses: { '201': { description: Immutable refund-share debit recorded } }
  /api/admin/supplier-settlement-policies/{supplierID}:
    get:
      tags: [Admin, Supplier Settlement]
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/SupplierID' }]
      responses: { '200': { description: Settlement policy } }
    put:
      tags: [Admin, Supplier Settlement]
      summary: Configure settlement cycle, minimum, commission, reserve, and payout adapter
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/SupplierID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SupplierSettlementPolicyWrite' } } } }
      responses: { '200': { description: Audited policy } }
  /api/admin/supplier-settlements:
    get:
      tags: [Admin, Supplier Settlement]
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      responses: { '200': { description: Settlement approval and payout queue } }
  /api/admin/supplier-settlements/{id}:
    get:
      tags: [Admin, Supplier Settlement]
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Settlement batch and item evidence } }
  /api/admin/supplier-settlements/run:
    post:
      tags: [Admin, Supplier Settlement]
      summary: Create a settlement batch from unbatched eligible platform entries
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [supplier_id, provider_id, period_start, period_end, idempotency_key], properties: { supplier_id: { type: string, format: uuid }, provider_id: { type: string, format: uuid }, period_start: { type: string, format: date }, period_end: { type: string, format: date }, idempotency_key: { type: string } } } } } }
      responses: { '201': { description: Pending-approval batch } }
  /api/admin/supplier-settlements/{id}/compliance:
    patch:
      tags: [Admin, Supplier Settlement]
      summary: Record tax and invoice verification status
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [tax_status, invoice_status, reason], properties: { tax_status: { type: string, enum: [NOT_REQUIRED, PENDING, VERIFIED, REJECTED] }, invoice_status: { type: string, enum: [NOT_REQUIRED, MISSING, SUBMITTED, APPROVED, REJECTED] }, reason: { type: string } } } } } }
      responses: { '200': { description: Compliance status updated } }
  /api/admin/supplier-settlements/{id}/approve:
    post:
      tags: [Admin, Supplier Settlement]
      summary: Four-eyes approve a settlement after platform and Provider bill reconciliation
      description: Re-locks every usage item; all must remain settled, statement-matched, and undisputed.
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { provider_statement_id: { type: string, format: uuid }, reason: { type: string } } } } } }
      responses: { '200': { description: Approved for the configured payout adapter }, '409': { description: Blocked by unsettled usage, unmatched statement, tax/invoice state, or dispute } }
  /api/admin/supplier-settlements/{id}/retry:
    post:
      tags: [Admin, Supplier Settlement]
      summary: Approve retry after a payout adapter failure
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } } }
      responses: { '200': { description: Retry scheduled with the original payout idempotency key } }
  /api/admin/supplier-bills:
    get:
      tags: [Admin, Supplier Settlement]
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      responses: { '200': { description: Supplier-declared bill queue } }
    post:
      tags: [Admin, Supplier Settlement]
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SupplierBillWrite' } } } }
      responses: { '201': { description: Bill declaration imported } }
  /api/admin/supplier-bills/{id}/reconcile:
    post:
      tags: [Admin, Supplier Settlement]
      summary: Compare supplier declaration with platform-measured accruals
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: RECONCILED or DISCREPANT result } }
  /api/admin/supplier-appeals:
    get:
      tags: [Admin, Supplier Settlement]
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      responses: { '200': { description: Supplier appeal queue } }
  /api/admin/supplier-appeals/{id}/resolve:
    post:
      tags: [Admin, Supplier Settlement]
      summary: Resolve a supplier appeal with an audited decision
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [decision, reason], properties: { decision: { type: string, enum: [UPHELD, REJECTED] }, reason: { type: string } } } } } }
      responses: { '200': { description: Appeal resolution and settlement state recorded } }
  /api/admin/payout-adapters:
    get:
      tags: [Admin, Supplier Settlement]
      summary: List payout adapter contract, region, and switch capabilities
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      responses: { '200': { description: Payout adapter capabilities without secrets } }
  /api/admin/marketplace/launch-reviews:
    get:
      tags: [Admin, Marketplace]
      summary: List versioned Marketplace launch reviews and current gates
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters:
        - { name: listing_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED, REJECTED, REVOKED] } }
      responses:
        '200': { description: Launch review queue, content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceLaunchReviewList' } } } }
  /api/admin/marketplace/launch-reviews/{id}:
    get:
      tags: [Admin, Marketplace]
      summary: Get one Marketplace launch review
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200': { description: Launch review, content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceLaunchReview' } } } }
  /api/admin/marketplace/providers/{id}/launch-reviews:
    post:
      tags: [Admin, Marketplace]
      summary: Idempotently open a versioned release review for a supplier-linked listing
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { policy_version: { type: string, maxLength: 100 } } } } }
      responses:
        '201': { description: Review created, content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceLaunchReview' } } } }
        '200': { description: Idempotent replay, content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceLaunchReview' } } } }
  /api/admin/marketplace/launch-reviews/{id}/evaluate:
    post:
      tags: [Admin, Marketplace]
      summary: Re-evaluate platform-owned evidence and append gate events
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/CSRFToken' }]
      responses:
        '200': { description: Evaluated review, content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceLaunchReview' } } } }
  /api/admin/marketplace/launch-reviews/{id}/gates/{gateCode}:
    put:
      tags: [Admin, Marketplace]
      summary: Attest one operational drill gate; automated gates reject attestations
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - { name: gateCode, in: path, required: true, schema: { type: string, enum: [SUPPLIER_SUSPENSION_DRILL, EMERGENCY_CUTOVER_DRILL, SUPPLIER_EXIT_DRILL] } }
        - $ref: '#/components/parameters/CSRFToken'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceGateAttestation' } } } }
      responses:
        '200': { description: Updated review, content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceLaunchReview' } } } }
  /api/admin/marketplace/launch-reviews/{id}/approve:
    post:
      tags: [Admin, Marketplace]
      summary: Approve a fully passed release as a second administrator
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 500 } } } } } }
      responses:
        '200': { description: Approved release, content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceLaunchReview' } } } }
        '409': { description: Review is incomplete or self-approval was attempted }
  /api/admin/marketplace/providers/{id}/lifecycle:
    post:
      tags: [Admin, Marketplace]
      summary: Start canary, suspend, resume, emergency-cutover, or exit a supplier publication
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceLifecycleAction' } } } }
      responses:
        '200': { description: Immutable lifecycle event, content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceLifecycleEvent' } } } }
  /api/admin/marketplace/providers/{id}/lifecycle-events:
    get:
      tags: [Admin, Marketplace]
      summary: List immutable Marketplace lifecycle events
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses: { '200': { description: Lifecycle events } }
  /api/admin/marketplace/payout-readiness/{supplierID}:
    get:
      tags: [Admin, Marketplace, Supplier Settlement]
      summary: Get supplier production-payout readiness
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/SupplierID' }]
      responses:
        '200': { description: Payout readiness, content: { application/json: { schema: { $ref: '#/components/schemas/SupplierPayoutReadiness' } } } }
    put:
      tags: [Admin, Marketplace, Supplier Settlement]
      summary: Optimistically review contract, tax, payment, and security evidence
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/SupplierID' }, { $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SupplierPayoutReadinessWrite' } } } }
      responses:
        '200': { description: Updated payout readiness, content: { application/json: { schema: { $ref: '#/components/schemas/SupplierPayoutReadiness' } } } }
        '409': { description: Stale version or independent review prerequisite missing }

components:
  securitySchemes:
    relaydockApiKey:
      type: http
      scheme: bearer
      bearerFormat: rdk_live_... or rdk_test_...
      description: Downstream RelayDock API key; never use an upstream provider key here.
    controlBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: relayedock_admin_session
      description: Administrator UI access-session cookie.
    adminRefreshCookie:
      type: apiKey
      in: cookie
      name: relayedock_admin_refresh
      description: Administrator UI refresh-session cookie.
    sharedSessionCookie:
      type: apiKey
      in: cookie
      name: relayedock_session
      description: Shared control-plane access-session cookie.
    sharedRefreshCookie:
      type: apiKey
      in: cookie
      name: relayedock_refresh
      description: Shared control-plane refresh-session cookie.
    consoleSessionCookie:
      type: apiKey
      in: cookie
      name: relayedock_console_session
      description: User Console access-session cookie.
    consoleRefreshCookie:
      type: apiKey
      in: cookie
      name: relayedock_console_refresh
      description: User Console refresh-session cookie.
  parameters:
    SupplierID:
      name: supplierID
      in: path
      required: true
      schema: { type: string, format: uuid }
    EndpointID:
      name: endpointID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationId:
      name: organizationID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationToken:
      name: token
      in: path
      required: true
      description: High-entropy invitation token delivered to the recipient; stored only as an HMAC digest.
      schema:
        type: string
        minLength: 32
    ProjectId:
      name: projectID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RouteId:
      name: routeID
      in: path
      required: true
      description: Project-route grant ID or referenced global model-route ID.
      schema:
        type: string
        format: uuid
    PolicyId:
      name: policyID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookId:
      name: webhookID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeliveryId:
      name: deliveryID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KeyId:
      name: keyID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AlertId:
      name: alertID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Days:
      name: days
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 365
        default: 30
    Period:
      name: period
      in: query
      schema:
        type: string
        enum: [today, 7d, 30d]
        default: 30d
    ProjectIdQuery:
      name: project_id
      in: query
      description: Optional V2 project scope; the caller's access is checked before data is returned.
      schema:
        type: string
        format: uuid
    BudgetPeriod:
      name: period
      in: query
      schema:
        type: string
        enum: [DAILY, MONTHLY]
        default: MONTHLY
    From:
      name: from
      in: query
      description: Inclusive RFC3339 timestamp or YYYY-MM-DD date.
      schema:
        type: string
    To:
      name: to
      in: query
      description: Exclusive RFC3339 timestamp; a YYYY-MM-DD date includes that complete UTC day.
      schema:
        type: string
    DeliveryStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [PENDING, PROCESSING, RETRY, DELIVERED, DEAD]
    ClientRequestId:
      name: X-Client-Request-Id
      in: header
      description: Optional bounded caller correlation ID; RelayDock still returns its own ID in X-Request-Id and X-RelayDock-Request-Id.
      schema:
        type: string
        maxLength: 512
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional logical inference request identity. Replays never reserve or charge again; omitted preserves one logical request per HTTP call.
      schema:
        type: string
        maxLength: 200
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required double-submit token matching the applicable relayedock_csrf, relayedock_admin_csrf, or relayedock_console_csrf cookie for state-changing cookie-authenticated requests; Bearer authentication does not require CSRF proof.
      schema:
        type: string
  pathItems:
    Organizations:
      description: Reused by the Admin and Console realms; cookie clients use the cookie for their path realm, while trusted integrations may use a control-plane Bearer token.
      get:
        tags: [V2 Tenancy]
        summary: List visible organizations
        security:
          - controlBearer: []
        parameters:
          - $ref: '#/components/parameters/Limit'
          - $ref: '#/components/parameters/Offset'
        responses:
          '200':
            description: Organizations visible in the current realm
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/OrganizationList'
          '401':
            $ref: '#/components/responses/Unauthorized'
      post:
        tags: [V2 Tenancy]
        summary: Create an organization
        description: The authenticated actor is added as an active OWNER.
        security:
          - controlBearer: []
        requestBody:
          required: true
          content:
