      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters: [{ name: status, in: query, schema: { type: string } }]
      responses: { '200': { description: Supplier applications } }
  /api/admin/suppliers/{supplierID}:
    get:
      tags: [Admin, Supplier Governance]
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/SupplierID' }]
      responses: { '200': { description: Supplier application and evidence } }
  /api/admin/suppliers/{supplierID}/compliance:
    patch:
      tags: [Admin, Supplier Governance]
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/SupplierID' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [kyb_status, contract_status], properties: { kyb_status: { type: string }, contract_status: { type: string }, contract_version: { type: string }, contract_start_at: { type: string, format: date-time }, contract_end_at: { type: string, format: date-time } } } } } }
      responses: { '200': { description: Compliance status updated } }
  /api/admin/suppliers/{supplierID}/review:
    patch:
