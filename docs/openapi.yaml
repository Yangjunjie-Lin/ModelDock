  /api/admin/providers/{id}/kill-switch:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Admin]
      summary: Immediately stop or resume new Provider traffic
      operationId: setProviderKillSwitch
      security: [{ controlBearer: [] }, { adminSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties: { enabled: { type: boolean } }
      responses: { '200': { description: Updated Provider } }

  /api/admin/provider-quality:
    get:
      tags: [Admin, Observability]
      summary: List platform-measured Provider quality policies and states
      description: Supplier declarations, marketplace uptime, and legacy model quality_score fields are not inputs to these states.
      operationId: listProviderQuality
      security: [{ controlBearer: [] }, { adminSessionCookie: [] }]
      responses:
        '200':
          description: Provider quality summaries
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ProviderQualitySummary' } }
  /api/admin/provider-quality/sla-events:
    get:
      tags: [Admin, Observability]
      summary: List measured Provider SLA events
      operationId: listProviderSLAEvents
      security: [{ controlBearer: [] }, { adminSessionCookie: [] }]
      parameters:
        - { name: provider_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [OPEN, RESOLVED] } }
      responses: { '200': { description: Provider SLA event list } }
  /api/admin/provider-quality/price-verifications:
    get:
      tags: [Admin, Pricing]
      summary: List independent exact-decimal Provider price evidence
      operationId: listProviderPriceVerifications
      security: [{ controlBearer: [] }, { adminSessionCookie: [] }]
      responses: { '200': { description: Immutable price verification list } }
    post:
      tags: [Admin, Pricing]
      summary: Record independently observed official price evidence
      description: The server compares this evidence with the currently approved Provider cost price book. Supplier-submitted price applications cannot call this endpoint.
      operationId: createProviderPriceVerification
      security: [{ controlBearer: [] }, { adminSessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 190 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderPriceVerificationCreate' }
      responses:
        '201': { description: Immutable price evidence recorded }
        '409': { description: Idempotency key reused with different evidence }
  /api/admin/providers/{id}/quality-policy:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [Admin, Observability]
      summary: Replace the operator-owned Provider quality policy
      operationId: updateProviderQualityPolicy
      security: [{ controlBearer: [] }, { adminSessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderQualityPolicy' }
      responses: { '200': { description: Updated quality policy } }
  /api/admin/providers/{id}/quality/evaluate:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Admin, Observability]
      summary: Evaluate the current immutable measurement window immediately
      operationId: evaluateProviderQuality
      security: [{ controlBearer: [] }, { adminSessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      responses: { '200': { description: Transactionally updated Provider quality state } }
  /api/admin/providers/{id}/quality/circuit-reset:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Admin, Observability]
      summary: Move a Provider quality circuit to audited half-open recovery
      operationId: resetProviderQualityCircuit
      security: [{ controlBearer: [] }, { adminSessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, minLength: 1, maxLength: 500 } }
      responses: { '200': { description: Circuit is half-open pending measured recovery } }
  /api/admin/providers/{id}/supplier-link:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Admin]
      summary: Link an approved supplier and start controlled Provider traffic ramp-up
      operationId: linkSupplierProvider
      security: [{ controlBearer: [] }, { adminSessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplier_id, reason]
              properties:
                supplier_id: { type: string, format: uuid }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses: { '200': { description: Supplier link and initial ramp cap committed atomically } }

  /api/admin/pricing/provider-cost-changes:
    get:
      tags: [Admin]
      summary: List manual, API, and CSV Provider cost changes
      operationId: listProviderCostChanges
      security: [{ controlBearer: [] }, { adminSessionCookie: [] }]
      responses: { '200': { description: Cost change requests } }
  /api/admin/pricing/provider-cost-changes/manual:
    post:
      tags: [Pricing, Admin]
      summary: Submit one manual Provider cost change for separate approval
      operationId: createManualProviderCostChange
      security: [{ controlBearer: [] }, { adminSessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderCostChangeWrite' }
      responses:
        '202': { description: Pending cost change }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/admin/pricing/provider-cost-changes/fetch:
    post:
      tags: [Pricing, Admin]
      summary: Fetch an allowlisted official Provider HTTPS JSON price feed
      description: The host must be listed in the Provider config pricing_api_hosts array. The response is bounded to 1 MiB and 500 price rows.
      operationId: fetchProviderCostChanges
      security: [{ controlBearer: [] }, { adminSessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 190 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider_id, source_url]
              properties:
                provider_id: { type: string, format: uuid }
                source_url: { type: string, format: uri, pattern: '^https://' }
                batch_idempotency_key: { type: string, maxLength: 190 }
      responses:
        '202': { description: Pending cost changes }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/admin/pricing/provider-cost-changes/import-csv:
    post:
      tags: [Pricing, Admin]
      summary: Atomically import Provider cost changes from bounded CSV
      description: Accepts at most 1 MiB and 500 data rows. Monetary fields are exact decimal strings.
      operationId: importProviderCostChangesCSV
      security: [{ controlBearer: [] }, { adminSessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - name: provider_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 190 }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, format: binary, maxLength: 1048576 }
      responses:
        '202': { description: Pending cost changes }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/admin/pricing/provider-cost-changes/{id}/review:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      tags: [Admin]
      summary: Approve or reject a Provider cost change
      operationId: reviewProviderCostChange
      security: [{ controlBearer: [] }, { adminSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT] }
                reason: { type: string }
      responses: { '200': { description: Reviewed cost change } }
  /api/admin/pricing/byok-service-fee-policies:
    get:
      tags: [Pricing, Admin]
      summary: List append-only BYOK platform service-fee policies
      operationId: listBYOKServiceFeePolicies
      security: [{ controlBearer: [] }, { adminSessionCookie: [] }]
