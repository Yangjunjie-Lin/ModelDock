      properties:
        event_type: { $ref: '#/components/schemas/FunnelEventType' }
        count: { type: integer, format: int64, minimum: 0 }
        conversion_from_previous:
          type: [number, 'null']
          minimum: 0
          description: Null for the first stage and whenever the previous-stage count is zero.
