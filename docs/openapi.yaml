      properties:
        HOMEPAGE_VISITED: { type: integer, format: int64, minimum: 0 }
        REGISTERED: { type: integer, format: int64, minimum: 0 }
        EMAIL_VERIFIED: { type: integer, format: int64, minimum: 0 }
        API_KEY_CREATED: { type: integer, format: int64, minimum: 0 }
        FIRST_RECHARGE: { type: integer, format: int64, minimum: 0 }
        FIRST_API_CALL: { type: integer, format: int64, minimum: 0 }
        SECOND_API_CALL: { type: integer, format: int64, minimum: 0 }
        FIRST_SUBSCRIPTION: { type: integer, format: int64, minimum: 0 }
