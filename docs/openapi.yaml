            $ref: '#/components/responses/Unauthorized'
          '404':
            $ref: '#/components/responses/NotFound'
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GatewayUnauthorized:
      description: RelayDock API-key authentication failed
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Request is not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ProviderMismatch:
      description: Provider, credential, and credential-group ownership do not match
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidReference:
      description: A referenced resource, relationship, or Webhook target is not valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource or model route not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooLarge:
      description: Request body exceeds the configured limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: RelayDock API-key limit reached
      headers:
        Retry-After:
          schema:
            type: integer
        X-RateLimit-Limit-Requests:
          schema:
            type: integer
        X-RateLimit-Remaining-Requests:
          schema:
            type: integer
        X-RateLimit-Limit-Tokens:
          schema:
            type: integer
        X-RateLimit-Remaining-Tokens:
          schema:
            type: integer
        X-RelayDock-RateLimit-Limit-Requests:
          schema:
            type: integer
        X-RelayDock-RateLimit-Remaining-Requests:
          schema:
            type: integer
        X-RelayDock-RateLimit-Limit-Tokens:
          schema:
            type: integer
        X-RelayDock-RateLimit-Remaining-Tokens:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ProviderError:
      description: Upstream provider connection or service error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: Required state or an eligible credential is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Internal service failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ProviderList:
      description: Providers
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/Provider'
    APIKeyList:
      description: API-key metadata; full key values are never listed
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/APIKeyMetadata'
    APIKeyCreated:
      description: One-time plaintext key plus metadata
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIKeyCreated'
    RequestLogList:
      description: Request metadata list
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/RequestLog'
    UsageList:
      description: Daily usage points
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/UsagePoint'
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, code]
          properties:
            message:
              type: string
            type:
              type: string
              const: relaydock_error
            param:
              type: [string, 'null']
            code:
              type: string
    Health:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: relaydock
    Readiness:
      type: object
      required: [status, postgres, redis]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        postgres:
          type: boolean
        redis:
          type: boolean
    ModelRequest:
      type: object
      required: [model]
      properties:
        model:
          type: string
          minLength: 1
        stream:
          type: boolean
      additionalProperties: true
    GatewayModel:
      type: object
      required: [id, object, created, owned_by]
      properties:
        id:
          type: string
        object:
          type: string
          const: model
        created:
          type: integer
          format: int64
        owned_by:
          type: string
          const: relaydock
    ModelList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/GatewayModel'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
    LoginResponse:
      type: object
      required: [user, expires_at, csrf_token]
      properties:
        user:
          $ref: '#/components/schemas/User'
        expires_at:
          type: string
          format: date-time
        csrf_token:
          type: string
    RefreshResponse:
      type: object
      required: [expires_at]
      properties:
        expires_at:
          type: string
          format: date-time
    User:
      type: object
      required: [id, email, display_name, role, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          type: string
          enum: [SUPER_ADMIN, ADMIN, USER]
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        monthly_token_limit:
          type: [integer, 'null']
          format: int64
        monthly_cost_limit:
          type: [number, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_login_at:
          type: [string, 'null']
          format: date-time
    UserCreate:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 12
          description: Omit to receive a one-time generated temporary password.
        display_name:
          type: string
        role:
          type: string
          enum: [ADMIN, USER]
          default: USER
    UserCreated:
      type: object
      required: [user, temporary_password, warning]
      properties:
        user:
          $ref: '#/components/schemas/User'
        temporary_password:
          type: string
          format: password
        warning:
          type: string
    UserList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
    Provider:
      type: object
      required: [id, name, slug, provider_type, base_url, enabled, config, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        provider_type:
          type: string
          enum: [openai, deepseek, openrouter]
        base_url:
          type: string
          format: uri
        enabled:
          type: boolean
        config:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProviderCreate:
      type: object
      additionalProperties: false
      required: [name, base_url]
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          description: Optional stable slug; derived from the name when omitted.
        provider_type:
          type: string
          enum: [openai, deepseek, openrouter]
          default: openai
        base_url:
          type: string
          format: uri
        enabled:
          type: boolean
          const: true
          default: true
        config:
          type: object
          additionalProperties: true
    ProviderUpdate:
      type: object
      additionalProperties: false
      required: [name, base_url, enabled]
      properties:
        name:
          type: string
          minLength: 1
        base_url:
          type: string
          format: uri
        enabled:
          type: boolean
        config:
          type: object
          additionalProperties: true
    Credential:
      type: object
      description: Provider credential metadata; ciphertext and plaintext secret are never serialized.
      required: [id, provider_id, name, credential_type, has_secret, secret_last4, status, priority, weight, max_concurrency, current_health]
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        provider_name:
          type: string
        name:
          type: string
        credential_type:
          type: string
          enum: [api_key, service_account, workload_identity]
        has_secret:
          type: boolean
        secret_last4:
          type: string
          maxLength: 4
        organization_id:
          type: [string, 'null']
        project_id:
          type: [string, 'null']
        status:
          type: string
          enum: [ACTIVE, DISABLED, RATE_LIMITED, COOLDOWN, AUTH_FAILED, UNHEALTHY, UNKNOWN]
        priority:
          type: integer
        weight:
          type: integer
          minimum: 1
        max_concurrency:
          type: integer
          minimum: 1
        current_health:
          type: string
        cooldown_until:
          type: [string, 'null']
          format: date-time
        active_requests:
          type: integer
          minimum: 0
    CredentialList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Credential'
    CredentialCreate:
      type: object
      required: [name]
      anyOf:
        - required: [secret]
        - required: [api_key]
      properties:
        provider_id:
          type: string
          format: uuid
          description: Defaults to the built-in OpenAI provider.
        name:
          type: string
        credential_type:
          type: string
          enum: [api_key, service_account, workload_identity]
          default: api_key
        secret:
          type: string
          format: password
          writeOnly: true
        api_key:
          type: string
          format: password
          writeOnly: true
          description: UI-compatible alias of secret.
        organization_id:
          type: [string, 'null']
        project_id:
          type: [string, 'null']
        group_id:
          type: [string, 'null']
          format: uuid
        credential_group_id:
          type: [string, 'null']
          format: uuid
          description: UI-compatible alias of group_id.
        priority:
          type: integer
          default: 0
        weight:
          type: integer
          minimum: 1
          default: 100
        max_concurrency:
          type: integer
          minimum: 1
          default: 10
        validate:
          type: boolean
          default: true
        save_disabled:
          type: boolean
          default: false
    AuthorizedCredentialImport:
      type: object
      required: [credentials]
      properties:
        validate:
          type: boolean
          default: true
        credentials:
          type: array
          minItems: 1
          maxItems: 25
          items:
            type: object
            required: [name, api_key]
            properties:
              provider_id:
                type: string
                format: uuid
                description: Defaults to the built-in OpenAI provider.
              name:
                type: string
              api_key:
                type: string
                format: password
                writeOnly: true
              organization_id:
                type: [string, 'null']
              project_id:
                type: [string, 'null']
              group_id:
                type: [string, 'null']
                format: uuid
              priority:
                type: integer
                default: 0
              weight:
                type: integer
                minimum: 1
                default: 100
              max_concurrency:
                type: integer
                minimum: 1
                default: 10
    BulkCredentialAction:
      type: object
      required: [credential_ids, action]
      properties:
        credential_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        action:
          type: string
          description: enable, disable, delete, health_check, or move:{credential-group-uuid}
    CredentialUpdate:
      type: object
      required: [name, status, weight, max_concurrency]
      properties:
        name:
          type: string
        secret:
          type: string
          format: password
          writeOnly: true
          description: Omit or send an empty string to retain the current secret.
        organization_id:
          type: [string, 'null']
        project_id:
          type: [string, 'null']
        status:
          type: string
          enum: [ACTIVE, DISABLED, RATE_LIMITED, COOLDOWN, AUTH_FAILED, UNHEALTHY, UNKNOWN]
        priority:
          type: integer
        weight:
          type: integer
          minimum: 1
        max_concurrency:
          type: integer
          minimum: 1
    CredentialGroup:
      type: object
      required: [id, provider_id, name, description, member_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        member_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CredentialGroupWrite:
      type: object
      required: [name]
      properties:
        provider_id:
          type: string
          format: uuid
          description: Defaults to the built-in OpenAI provider.
        name:
          type: string
        description:
          type: string
    CredentialGroupList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CredentialGroup'
    MembershipWrite:
      type: object
      properties:
        weight:
          type: integer
          minimum: 1
          default: 100
        priority:
          type: integer
          default: 0
    AdminModel:
      type: object
      required: [id, provider_id, provider_model_id, display_name, model_type, enabled, capabilities, capability_source]
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        provider_model_id:
          type: string
        display_name:
          type: string
        model_type:
          type: string
        enabled:
          type: boolean
        capabilities:
          type: array
          items:
            type: string
        capability_source:
          type: string
          enum: [provider, manual]
        context_window:
          type: [integer, 'null']
        metadata:
          type: object
          additionalProperties: true
    AdminModelList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminModel'
    ModelPrice:
      type: object
      required: [id, model_id, version, effective_from, input_price, cached_input_price, output_price, currency, unit, source, created_at]
      properties:
        id:
          type: string
          format: uuid
        model_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        effective_from:
          type: string
          format: date-time
        input_price:
          type: number
          minimum: 0
        cached_input_price:
          type: number
          minimum: 0
        output_price:
          type: number
          minimum: 0
        currency:
          type: string
          default: USD
        unit:
          type: integer
          format: int64
          default: 1000000
        source:
          type: string
          default: manual
        created_at:
          type: string
          format: date-time
    ModelPriceWrite:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        effective_from:
          type: string
          format: date-time
        input_price:
          type: number
          minimum: 0
          default: 0
        cached_input_price:
          type: number
          minimum: 0
          default: 0
        output_price:
          type: number
          minimum: 0
          default: 0
        currency:
          type: string
          default: USD
        unit:
          type: integer
          format: int64
          minimum: 1
          default: 1000000
        source:
          type: string
          default: manual
    ModelRoute:
      type: object
      required: [id, alias, provider_id, upstream_model, credential_group_id, enabled, routing_policy, fallback_config]
      properties:
        id:
          type: string
          format: uuid
        alias:
          type: string
        provider_id:
          type: string
          format: uuid
        upstream_model:
          type: string
        credential_group_id:
          type: string
          format: uuid
        fallback_group_id:
          type: [string, 'null']
          format: uuid
        enabled:
          type: boolean
        routing_policy:
          type: string
        fallback_config:
          type: object
          additionalProperties: true
    ModelRouteCreate:
      type: object
      additionalProperties: false
      required: [alias, provider_id, upstream_model, credential_group_id]
      properties:
        alias:
          type: string
        provider_id:
          type: string
          format: uuid
        upstream_model:
          type: string
        credential_group_id:
          type: string
          format: uuid
        fallback_group_id:
          type: [string, 'null']
          format: uuid
        routing_policy:
          type: string
          enum: [priority_weighted, least_loaded, weighted_round_robin]
          default: priority_weighted
        fallback_config:
          type: object
          additionalProperties: true
    ModelRouteUpdate:
      type: object
      additionalProperties: false
      required: [alias, provider_id, upstream_model, credential_group_id, enabled]
      properties:
        alias:
          type: string
        provider_id:
          type: string
          format: uuid
        upstream_model:
          type: string
        credential_group_id:
          type: string
          format: uuid
        fallback_group_id:
          type: [string, 'null']
          format: uuid
        enabled:
          type: boolean
        routing_policy:
          type: string
          enum: [priority_weighted, least_loaded, weighted_round_robin]
          default: priority_weighted
        fallback_config:
          type: object
          additionalProperties: true
    ModelRouteList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ModelRoute'
    ConsoleModel:
      type: object
      required: [id, alias, display_name, enabled, capabilities, context_window]
      description: A public RelayDock alias without provider or credential-pool routing details.
      properties:
        id:
          type: string
        alias:
          type: string
        display_name:
          type: string
        enabled:
          type: boolean
          const: true
        capabilities:
          type: array
          items:
            type: string
        context_window:
          type: [integer, 'null']
          format: int64
    ConsoleModelList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConsoleModel'
    APIKeyMetadata:
      type: object
      required: [id, user_id, name, environment, key_prefix, status, rate_limit_rpm, rate_limit_tpm, allowed_models, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
          description: Present in project-scoped V2 responses.
        project_id:
          type: string
          format: uuid
          description: Present in project-scoped V2 responses.
        name:
          type: string
        environment:
          type: string
          enum: [live, test]
        key_prefix:
          type: string
        status:
          type: string
          enum: [ACTIVE, DISABLED, REVOKED]
        expires_at:
          type: [string, 'null']
          format: date-time
        rate_limit_rpm:
          type: integer
        rate_limit_tpm:
          type: integer
        monthly_token_limit:
          type: [integer, 'null']
          format: int64
        monthly_cost_limit:
          type: [number, 'null']
        allowed_models:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, 'null']
          format: date-time
        current_version:
          type: integer
          minimum: 1
          description: Present in project-scoped V2 responses.
    APIKeyCreate:
      type: object
      required: [name]
      properties:
        project_id:
          type: string
          format: uuid
          description: V2 project scope; defaults to the fixed Legacy project for V1 compatibility.
        name:
          type: string
        environment:
          type: string
          enum: [live, test]
          default: live
        expires_at:
          type: [string, 'null']
          format: date-time
        rate_limit_rpm:
          type: integer
          minimum: 1
          default: 60
        rate_limit_tpm:
          type: integer
          minimum: 1
          default: 100000
        monthly_token_limit:
          type: [integer, 'null']
          format: int64
        monthly_cost_limit:
          type: [number, 'null']
        allowed_models:
          type: array
          items:
            type: string
    APIKeyCreated:
      type: object
      required: [api_key, key, secret, warning]
      properties:
        api_key:
          $ref: '#/components/schemas/APIKeyMetadata'
        key:
          type: string
          pattern: '^rdk_(live|test)_'
        secret:
          type: string
          description: V1 compatibility alias of key; also shown once.
        warning:
          type: string
    Dashboard:
      type: object
      additionalProperties: true
      properties:
        total_requests:
          type: integer
          format: int64
        requests_today:
          type: integer
          format: int64
        input_tokens:
          type: integer
          format: int64
        total_input_tokens:
          type: integer
          format: int64
        cached_input_tokens:
          type: integer
          format: int64
        total_cached_tokens:
          type: integer
          format: int64
        output_tokens:
          type: integer
          format: int64
        total_output_tokens:
          type: integer
          format: int64
        estimated_cost:
          type: number
        errors:
          type: integer
          format: int64
        success_rate:
          type: number
        average_latency_ms:
          type: number
        p95_latency_ms:
          type: number
        active_credentials:
          type: integer
          format: int64
        healthy_credentials:
          type: integer
          format: int64
        rate_limited_credentials:
          type: integer
          format: int64
        request_trend:
          type: array
          description: Hourly request totals for the latest 24-hour window.
          items:
            $ref: '#/components/schemas/DashboardRequestTrendPoint'
        token_trend:
          type: array
          description: Hourly token totals for the latest 24-hour window.
          items:
            $ref: '#/components/schemas/DashboardTokenTrendPoint'
        model_distribution:
          type: array
          description: Request totals for the eight most-used model aliases.
          items:
            $ref: '#/components/schemas/DashboardModelDistributionPoint'
        status_code_distribution:
          type: array
          description: Request totals grouped by HTTP response status.
          items:
            $ref: '#/components/schemas/DashboardStatusDistributionPoint'
        alerts:
          type: array
          description: Up to four latest operational alerts for an administrator dashboard; empty for a user-scoped dashboard.
          items:
            $ref: '#/components/schemas/Alert'
    DashboardRequestTrendPoint:
      type: object
      required: [label, value, requests]
      properties:
        label:
          type: string
          description: Hour label in HH:MM form.
        value:
          type: integer
          format: int64
        requests:
          type: integer
          format: int64
    DashboardTokenTrendPoint:
      type: object
      required: [label, input, cached, output]
      properties:
        label:
