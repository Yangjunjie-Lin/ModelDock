      security:
        - controlBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialUpdate'
      responses:
        '200':
          description: Updated masked credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
