        '422': { $ref: '#/components/responses/ValidationError' }
  /api/admin/pricing/byok-service-fee-policies/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    delete:
      tags: [Pricing, Admin]
      summary: Permanently disable a BYOK service-fee policy
      operationId: disableBYOKServiceFeePolicy
      security: [{ controlBearer: [] }, { adminSessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
