openapi: 3.1.0
info:
  title: RelayDock API
  version: 2.0.0
  summary: Authorized-credential AI gateway and control plane
  description: |
    RelayDock exposes an OpenAI-compatible data plane and a separate control
    plane. OpenAI-compatible request and response bodies are intentionally open
    to additive fields. RelayDock does not expose account registration,
    CAPTCHA, consumer session, promotion, or policy-evasion APIs.
    Every response includes X-Request-Id and X-RelayDock-Request-Id; both carry
    RelayDock's trusted, server-generated request ID.
  license:
    name: License not yet selected
servers:
  - url: http://127.0.0.1:8081
    description: Local control plane
tags:
  - name: Operations
  - name: Gateway
  - name: Authentication
  - name: Admin
  - name: Console
  - name: V2 Tenancy
  - name: V2 Budgets
  - name: V2 Webhooks
  - name: V2 Keys
paths:
  /healthz:
    get:
      tags: [Operations]
      summary: Process liveness
      operationId: healthz
      servers:
        - url: http://127.0.0.1:8080
          description: Local gateway listener
        - url: http://127.0.0.1:8081
          description: Local control-plane listener
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      tags: [Operations]
      summary: Dependency readiness
      operationId: readyz
      servers:
        - url: http://127.0.0.1:8080
          description: Local gateway listener
        - url: http://127.0.0.1:8081
          description: Local control-plane listener
      security: []
      responses:
        '200':
          description: PostgreSQL and Redis are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: A required dependency is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /metrics:
    get:
      tags: [Operations]
      summary: Prometheus metrics
      operationId: metrics
      servers:
        - url: http://127.0.0.1:8080
          description: Local gateway listener
        - url: http://127.0.0.1:8081
          description: Local control-plane listener
      security: []
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
  /v1/models:
    get:
      tags: [Gateway]
      summary: List enabled RelayDock model aliases
      operationId: listModels
      servers:
        - url: http://127.0.0.1:8080
      security:
        - relaydockApiKey: []
      responses:
        '200':
          description: Model alias list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/responses:
    post:
      tags: [Gateway]
      summary: Create an OpenAI-compatible response
      operationId: createResponse
      servers:
        - url: http://127.0.0.1:8080
      security:
        - relaydockApiKey: []
      parameters:
        - $ref: '#/components/parameters/ClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelRequest'
      responses:
        '200':
          description: OpenAI-compatible JSON response or SSE stream
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/ProviderError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/chat/completions:
    post:
      tags: [Gateway]
      summary: Create an OpenAI-compatible chat completion
      operationId: createChatCompletion
      servers:
        - url: http://127.0.0.1:8080
      security:
        - relaydockApiKey: []
      parameters:
        - $ref: '#/components/parameters/ClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelRequest'
      responses:
        '200':
          description: OpenAI-compatible JSON completion or SSE stream
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/ProviderError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/embeddings:
    post:
      tags: [Gateway]
      summary: Create OpenAI-compatible embeddings
      operationId: createEmbedding
      servers:
        - url: http://127.0.0.1:8080
      security:
        - relaydockApiKey: []
      parameters:
        - $ref: '#/components/parameters/ClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelRequest'
      responses:
        '200':
          description: OpenAI-compatible embedding list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/GatewayUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/ProviderError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Create a control-plane session
      operationId: login
      servers:
        - url: http://127.0.0.1:8081
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session and CSRF token
          headers:
            Set-Cookie:
              description: relayedock_session and relayedock_refresh (HttpOnly), plus readable relayedock_csrf
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/admin/auth/login:
    post:
      tags: [Authentication]
      summary: Create an administrator UI session
      operationId: loginAdmin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session and CSRF token
          headers:
            Set-Cookie:
              description: relayedock_admin_session and relayedock_admin_refresh (HttpOnly), plus readable relayedock_admin_csrf
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/console/auth/login:
    post:
      tags: [Authentication]
      summary: Create a console UI session
      operationId: loginConsole
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session and CSRF token
          headers:
            Set-Cookie:
              description: relayedock_console_session and relayedock_console_refresh (HttpOnly), plus readable relayedock_console_csrf
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate the access and refresh session cookies
      operationId: refreshSession
      servers:
        - url: http://127.0.0.1:8081
      security:
        - sharedRefreshCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Session cookies rotated
          headers:
            Set-Cookie:
              description: Rotated relayedock_session and relayedock_refresh HttpOnly cookies
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate administrator UI session cookies
      operationId: refreshAdminSession
      security:
        - adminRefreshCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Session cookies rotated
          headers:
            Set-Cookie:
              description: Rotated relayedock_admin_session and relayedock_admin_refresh HttpOnly cookies
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/console/auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate console UI session cookies
      operationId: refreshConsoleSession
      security:
        - consoleRefreshCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Session cookies rotated
          headers:
            Set-Cookie:
              description: Rotated relayedock_console_session and relayedock_console_refresh HttpOnly cookies
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Return the authenticated user
      operationId: getCurrentUser
      servers:
        - url: http://127.0.0.1:8081
      security:
        - controlBearer: []
        - sharedSessionCookie: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Clear the browser session
      operationId: logout
      servers:
        - url: http://127.0.0.1:8081
      security:
        - controlBearer: []
        - sharedSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Session cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/auth/logout:
    post:
      tags: [Authentication]
      summary: Clear the administrator UI session
      operationId: logoutAdmin
      security:
        - controlBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Administrator session cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/console/auth/logout:
    post:
      tags: [Authentication]
      summary: Clear the console UI session
      operationId: logoutConsole
      security:
        - controlBearer: []
        - consoleSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Console session cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/dashboard:
    get:
      tags: [Admin]
      summary: Global operational summary
      operationId: getAdminDashboard
      security:
        - controlBearer: []
        - adminSessionCookie: []
      responses:
        '200':
          description: Dashboard totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/providers:
    get:
      tags: [Admin]
      summary: List providers
      operationId: listProviders
      security:
        - controlBearer: []
        - adminSessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/ProviderList'
    post:
      tags: [Admin]
      summary: Create a provider configuration
      operationId: createProvider
      security:
        - controlBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCreate'
      responses:
        '201':
          description: Provider created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/admin/providers/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [Admin]
      summary: Update a provider
      operationId: updateProvider
      security:
        - controlBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderUpdate'
      responses:
        '200':
          description: Provider updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin]
      summary: Delete a non-built-in provider
      operationId: deleteProvider
      security:
        - controlBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Provider deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/providers/{id}/sync-models:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Admin]
      summary: Synchronize models through one authorized credential
      operationId: syncProviderModels
      security:
        - controlBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential_id]
              properties:
                credential_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Synchronization count
          content:
            application/json:
              schema:
                type: object
                required: [synced]
                properties:
                  synced:
                    type: integer
                    minimum: 0
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/ProviderError'
  /api/admin/credentials:
    get:
      tags: [Admin]
      summary: List masked provider credentials
      operationId: listCredentials
      security:
        - controlBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Masked credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialList'
    post:
      tags: [Admin]
      summary: Validate and encrypt an authorized provider credential
      operationId: createCredential
      security:
        - controlBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCreate'
      responses:
        '201':
          description: Masked credential metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: Provider validation or credential-group ownership validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/admin/credentials/import:
    post:
      tags: [Admin]
      summary: Import up to 25 already-issued official API credentials
      description: |
        JSON-only authorized credential import. It does not accept account
        passwords, browser cookies, consumer sessions, or registration input.
        Provider API keys are encrypted and never echoed in the response.
      operationId: importAuthorizedCredentials
      security:
        - controlBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizedCredentialImport'
      responses:
        '200':
          description: Per-item import results
          content:
            application/json:
              schema:
                type: object
                required: [created, total, results]
                properties:
                  created:
                    type: integer
                    minimum: 0
                  total:
                    type: integer
                    minimum: 1
                    maximum: 25
                  results:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/admin/credentials/bulk:
    post:
      tags: [Admin]
      summary: Apply an action to stored credential IDs
      operationId: bulkCredentialAction
      security:
        - controlBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCredentialAction'
      responses:
        '200':
          description: Number of selected IDs processed
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated:
                    type: integer
                    minimum: 0
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/admin/credentials/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [Admin]
      summary: Update credential metadata or replace its secret
      operationId: updateCredential
      security:
        - controlBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialUpdate'
      responses:
        '200':
          description: Updated masked credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin]
      summary: Delete a provider credential
      operationId: deleteCredential
      security:
        - controlBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Credential deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/credentials/{id}/test:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Admin]
      summary: Validate a stored credential with the official provider API
      operationId: testCredential
      security:
        - controlBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Credential is healthy
          content:
            application/json:
              schema:
                type: object
                required: [ok, status]
                properties:
                  ok:
                    type: boolean
                    const: true
                  status:
                    type: string
                    const: HEALTHY
        '422':
          description: Provider validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/admin/credentials/{id}/status:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    patch:
      tags: [Admin]
      summary: Enable or disable a provider credential
      operationId: setCredentialStatus
      security:
        - controlBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveDisabledPatch'
      responses:
        '200':
          description: New state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResult'
  /api/admin/credential-groups:
    get:
      tags: [Admin]
      summary: List credential groups
      operationId: listCredentialGroups
      security:
        - controlBearer: []
        - adminSessionCookie: []
      responses:
        '200':
          description: Credential groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialGroupList'
    post:
      tags: [Admin]
      summary: Create a credential group
      operationId: createCredentialGroup
      security:
        - controlBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialGroupWrite'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialGroup'
  /api/admin/credential-groups/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    delete:
      tags: [Admin]
      summary: Delete a credential group
      operationId: deleteCredentialGroup
      security:
        - controlBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Group deleted
  /api/admin/credential-groups/{id}/members/{credentialId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/CredentialId'
    put:
      tags: [Admin]
      summary: Add or update a credential group member
      operationId: setCredentialGroupMember
      security:
        - controlBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipWrite'
      responses:
        '200':
          description: Membership set
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '422':
          $ref: '#/components/responses/ProviderMismatch'
    delete:
      tags: [Admin]
      summary: Remove a credential group member
      operationId: removeCredentialGroupMember
      security:
        - controlBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Membership removed
  /api/admin/models:
    get:
      tags: [Admin]
      summary: List synchronized model metadata
      operationId: listAdminModels
      security:
        - controlBearer: []
        - adminSessionCookie: []
      responses:
        '200':
          description: Model metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminModelList'
