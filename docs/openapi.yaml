      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [decision, reason], properties: { decision: { type: string, enum: [APPROVED, REJECTED, REQUESTED_CHANGES, SUSPENDED, EXITED] }, reason: { type: string } } } } } }
      responses: { '200': { description: Reviewed supplier }, '409': { description: Required evidence is missing } }
  /api/admin/suppliers/{supplierID}/status:
    patch:
      tags: [Admin, Supplier Governance]
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/SupplierID' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status, reason], properties: { status: { type: string }, reason: { type: string } } } } } }
      responses: { '200': { description: Administrative status transition } }
  /api/admin/supplier-evidence/{type}/{id}:
    patch:
      tags: [Admin, Supplier Governance]
