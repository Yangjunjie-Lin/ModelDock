      type: object
      required: [subject, body]
      properties:
        subject: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 10000, description: Redacted before persistence; credentials and customer content must not be submitted. }
        priority: { type: string, enum: [LOW, NORMAL, HIGH, URGENT], default: NORMAL }
        user_id: { type: string, format: uuid, description: Admin-only association override. }
        organization_id: { type: string, format: uuid }
        request_id: { type: string, maxLength: 200 }
        order_id: { type: string, format: uuid }
        ledger_journal_id: { type: string, format: uuid }
        context:
          type: object
          description: Only documented correlation keys survive the server allowlist.
          additionalProperties: true
    SupportTicketMessageCreate:
      type: object
      required: [body]
