  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: The requested mutation conflicts with current state or reuses an idempotency key for different logical input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: The request is syntactically valid but fails a business, pricing, or governance validation rule.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GatewayUnauthorized:
      description: RelayDock API-key authentication failed
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GatewayPaymentRequired:
      description: The organization wallet is frozen or cannot reserve the maximum request cost; error.code is insufficient_balance.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GatewayIdempotencyConflict:
      description: The idempotency key conflicts with different input, or this logical request was already admitted. An admitted replay creates no additional reservation or charge and does not replay the original model output.
      headers:
        X-RelayDock-Original-Request-Id:
          description: Present for error.code=idempotent_replay and identifies the originally admitted RelayDock request; absent for a different-payload idempotency_conflict.
          schema:
            type: string
            minLength: 1
            maxLength: 200
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Request is not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ProviderMismatch:
      description: Provider, credential, and credential-group ownership do not match
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidReference:
      description: A referenced resource, relationship, or Webhook target is not valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource or model route not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooLarge:
      description: Request body exceeds the configured limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: RelayDock API-key limit reached
      headers:
        Retry-After:
          schema:
            type: integer
        X-RateLimit-Limit-Requests:
          schema:
            type: integer
        X-RateLimit-Remaining-Requests:
          schema:
            type: integer
        X-RateLimit-Limit-Tokens:
          schema:
            type: integer
        X-RateLimit-Remaining-Tokens:
          schema:
            type: integer
        X-RelayDock-RateLimit-Limit-Requests:
          schema:
            type: integer
        X-RelayDock-RateLimit-Remaining-Requests:
          schema:
            type: integer
        X-RelayDock-RateLimit-Limit-Tokens:
          schema:
            type: integer
        X-RelayDock-RateLimit-Remaining-Tokens:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ProviderError:
      description: Upstream Provider connection or service error. When a configured fallback follows an ambiguous pre-response connection error, the first and fallback upstream calls may both have been processed even though the gateway returns 502.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: Required state or an eligible credential is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Internal service failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ProviderList:
      description: Providers
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/Provider'
    APIKeyList:
      description: API-key metadata; full key values are never listed
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/APIKeyMetadata'
    APIKeyCreated:
      description: One-time plaintext key plus metadata
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIKeyCreated'
    RequestLogList:
      description: Request metadata list
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/RequestLog'
    UsageList:
