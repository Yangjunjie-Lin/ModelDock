      summary: List the support queue
      parameters:
        - { name: organization_id, in: query, schema: { type: string, format: uuid } }
      responses: { '200': { description: Support ticket list } }
    post:
      tags: [Operations, Admin]
      summary: Create a linked, redacted, audited support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportTicketCreate' }
      responses: { '201': { description: Support ticket } }
  /api/admin/support/tickets/{id}:
    get:
      tags: [Operations, Admin]
      summary: Read a ticket including internal notes
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Support ticket } }
    patch:
      tags: [Operations, Admin]
      summary: Update ticket status, priority, or assignment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [OPEN, IN_PROGRESS, WAITING_FOR_USER, RESOLVED, CLOSED] }
                priority: { type: string, enum: [LOW, NORMAL, HIGH, URGENT] }
