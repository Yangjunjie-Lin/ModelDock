components:
  securitySchemes:
    relaydockApiKey:
      type: http
      scheme: bearer
      bearerFormat: rdk_live_... or rdk_test_...
      description: Downstream RelayDock API key; never use an upstream provider key here.
    controlBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: relayedock_admin_session
      description: Administrator UI access-session cookie.
    adminRefreshCookie:
      type: apiKey
      in: cookie
      name: relayedock_admin_refresh
      description: Administrator UI refresh-session cookie.
    sharedSessionCookie:
      type: apiKey
      in: cookie
      name: relayedock_session
      description: Shared control-plane access-session cookie.
    sharedRefreshCookie:
      type: apiKey
      in: cookie
      name: relayedock_refresh
      description: Shared control-plane refresh-session cookie.
    consoleSessionCookie:
      type: apiKey
      in: cookie
      name: relayedock_console_session
      description: User Console access-session cookie.
    consoleRefreshCookie:
      type: apiKey
      in: cookie
      name: relayedock_console_refresh
      description: User Console refresh-session cookie.
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationId:
      name: organizationID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RouteId:
      name: routeID
      in: path
      required: true
      description: Project-route grant ID or referenced global model-route ID.
      schema:
        type: string
        format: uuid
    PolicyId:
      name: policyID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookId:
      name: webhookID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeliveryId:
      name: deliveryID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KeyId:
      name: keyID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AlertId:
      name: alertID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Days:
      name: days
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 365
        default: 30
    Period:
      name: period
      in: query
      schema:
        type: string
        enum: [today, 7d, 30d]
        default: 30d
    ProjectIdQuery:
      name: project_id
      in: query
      description: Optional V2 project scope; the caller's access is checked before data is returned.
      schema:
        type: string
        format: uuid
    BudgetPeriod:
      name: period
      in: query
      schema:
        type: string
        enum: [DAILY, MONTHLY]
        default: MONTHLY
    From:
      name: from
      in: query
      description: Inclusive RFC3339 timestamp or YYYY-MM-DD date.
      schema:
        type: string
    To:
      name: to
      in: query
      description: Exclusive RFC3339 timestamp; a YYYY-MM-DD date includes that complete UTC day.
      schema:
        type: string
    DeliveryStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [PENDING, PROCESSING, RETRY, DELIVERED, DEAD]
    ClientRequestId:
      name: X-Client-Request-Id
      in: header
      description: Optional bounded caller correlation ID; RelayDock still returns its own ID in X-Request-Id and X-RelayDock-Request-Id.
      schema:
        type: string
        maxLength: 512
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required double-submit token matching the applicable relayedock_csrf, relayedock_admin_csrf, or relayedock_console_csrf cookie for state-changing cookie-authenticated requests; Bearer authentication does not require CSRF proof.
      schema:
        type: string
