        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCredentialAction'
      responses:
        '200':
          description: Number of selected IDs processed
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated:
                    type: integer
                    minimum: 0
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/admin/credentials/{id}:
    parameters:
