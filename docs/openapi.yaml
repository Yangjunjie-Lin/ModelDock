  /api/console/byok/credentials:
    get:
      tags: [Console]
      summary: List BYOK credentials for an accessible organization
      operationId: listBYOKCredentials
      security: [{ controlBearer: [] }, { consoleSessionCookie: [] }]
      parameters: [{ name: organization_id, in: query, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Redacted credential metadata } }
    post:
      tags: [Console]
      summary: Encrypt and save an organization-owned official Provider credential
      operationId: createBYOKCredential
      security: [{ controlBearer: [] }, { consoleSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_id, project_id, name, secret, terms_version, ownership_confirmed]
              properties:
                provider_id: { type: string, format: uuid }
                project_id: { type: string, format: uuid }
                name: { type: string }
                secret: { type: string, writeOnly: true }
                terms_version: { type: string }
                ownership_confirmed: { type: boolean, const: true }
      responses: { '201': { description: Redacted encrypted credential metadata } }
  /api/console/byok/credentials/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    delete:
      tags: [Console]
      summary: Disable an organization-owned BYOK credential
      operationId: disableBYOKCredential
      security: [{ controlBearer: [] }, { consoleSessionCookie: [] }]
      parameters: [{ name: organization_id, in: query, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Disabled } }
  /api/admin/credentials:
    get:
      tags: [Admin]
      summary: List masked provider credentials
      operationId: listCredentials
      security:
        - controlBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Masked credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialList'
    post:
      tags: [Admin]
      summary: Validate and encrypt an authorized provider credential
      operationId: createCredential
      security:
        - controlBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCreate'
      responses:
        '201':
          description: Masked credential metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: Provider validation or credential-group ownership validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/admin/credentials/import:
    post:
      tags: [Admin]
      summary: Import up to 25 already-issued official API credentials
      description: |
        JSON-only authorized credential import. It does not accept account
        passwords, browser cookies, consumer sessions, or registration input.
        Provider API keys are encrypted and never echoed in the response.
      operationId: importAuthorizedCredentials
      security:
        - controlBearer: []
        - adminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizedCredentialImport'
      responses:
        '200':
          description: Per-item import results
          content:
            application/json:
              schema:
                type: object
                required: [created, total, results]
                properties:
                  created:
                    type: integer
                    minimum: 0
                  total:
                    type: integer
                    minimum: 1
                    maximum: 25
                  results:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/admin/credentials/bulk:
    post:
      tags: [Admin]
