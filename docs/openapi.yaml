openapi: 3.1.0
info:
  title: RelayDock API
  version: 2.0.0
  summary: Authorized-credential AI gateway and control plane
  description: |
    RelayDock exposes an OpenAI-compatible data plane and a separate control
    plane. OpenAI-compatible request and response bodies are intentionally open
    to additive fields. ModelDock adds verified SaaS account registration and
    organization invitations while retaining RelayDock-compatible paths,
    environment names, cookies, and rdk_* API keys. It does not expose CAPTCHA
    bypass, bulk account creation, credential trading, or policy-evasion APIs.
    Every response includes X-Request-Id and X-RelayDock-Request-Id; both carry
    RelayDock's trusted, server-generated request ID.
  license:
    name: License not yet selected
servers:
  - url: http://127.0.0.1:8081
    description: Local control plane
tags:
  - name: Operations
  - name: Gateway
  - name: Authentication
  - name: Admin
  - name: Console
  - name: V2 Tenancy
  - name: V2 Budgets
  - name: V2 Webhooks
  - name: V2 Keys
  - name: Pricing
  - name: Payments
  - name: Subscriptions
  - name: Finance
  - name: Governance
  - name: Public Commercial
  - name: Onboarding
  - name: Funnel
  - name: Supplier Governance
  - name: Supplier Settlement
paths:
  /startupz:
    get:
      tags: [Operations]
      summary: Startup probe
      responses:
        '200': { description: Application initialization is complete }
        '503': { description: Application is still starting }
  /api/public/config:
    get:
      tags: [Public Commercial]
      summary: Read public product, registration, verification, and legal-review configuration
      operationId: getPublicCommercialConfig
      security: []
      responses:
        '200':
          description: Public configuration without secret or tenant state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicCommercialConfig' }
  /api/public/catalog/models:
    get:
      tags: [Public Commercial]
      summary: List models with purchase-time regional availability and approved retail prices
      operationId: listPublicModels
      security: []
      parameters:
        - { name: region, in: query, required: false, schema: { type: string, pattern: '^[A-Z]{2}$', default: CN } }
        - { name: currency, in: query, required: false, description: When omitted, the first currently published currency is selected; 422 is returned if none exists., schema: { type: string, pattern: '^[A-Z]{3}$' } }
      responses:
        '200':
          description: Public-safe model catalog; unavailable or unpriced models remain explicit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicModelCatalog' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { description: No published pricing currency is available }
  /api/public/catalog/providers:
    get:
      tags: [Public Commercial]
      summary: List Provider commercial, region, processing, retention, and status disclosure
      operationId: listPublicProviders
      security: []
      parameters:
        - { name: region, in: query, required: false, schema: { type: string, pattern: '^[A-Z]{2}$', default: CN } }
      responses:
        '200':
          description: Public-safe Provider catalog without credentials, base URLs, costs, margins, or contract documents
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicProviderCatalog' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/public/pricing:
    get:
      tags: [Public Commercial]
      summary: Read separate subscription, Token, payment/platform fee, bonus, tax, and refund disclosures
      operationId: getPublicPricing
      security: []
      parameters:
        - { name: region, in: query, required: false, schema: { type: string, pattern: '^[A-Z]{2}$', default: CN } }
        - { name: currency, in: query, required: false, description: When omitted, the first currently published currency is selected; 422 is returned if none exists., schema: { type: string, pattern: '^[A-Z]{3}$' } }
      responses:
        '200':
          description: Exact-decimal effective pricing; null commercial terms do not authorize checkout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicPricing' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { description: No published pricing currency is available }
  /api/public/status:
    get:
      tags: [Public Commercial, Operations]
      summary: Public privacy-safe status alias
      operationId: getPublicCommercialStatus
      security: []
      responses:
        '200': { description: Gateway, Dashboard, Billing, Provider, and public incident status. Provider OPERATIONAL requires commercial/resale admission, pricing enabled, and at least one schedulable credential; it is not a continuous upstream availability probe. }
  /api/public/funnel/events:
    post:
      tags: [Funnel]
      summary: Record an idempotent, privacy-bounded homepage visit
      description: Only HOMEPAGE_VISITED is caller-writable. All authenticated/commercial milestones come from trusted transactional evidence. The raw anonymous_id is HMACed and not persisted. An idempotency key is required in the header or body.
      operationId: recordPublicFunnelEvent
      security: []
      parameters:
        - { name: Idempotency-Key, in: header, required: false, description: Required unless idempotency_key is supplied in the body., schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicFunnelEventWrite' }
      responses:
        '200':
          description: Idempotent replay of the original event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicFunnelEventResult' }
        '201':
          description: New homepage visit event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicFunnelEventResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Idempotency key was reused for a different event payload }
        '429': { description: Public event ingestion rate limit reached }
  /api/console/onboarding:
    get:
      tags: [Onboarding, Console]
      summary: Derive onboarding steps from authenticated transactional evidence
      operationId: getConsoleOnboarding
      security: [{ consoleSessionCookie: [] }, { controlBearer: [] }]
      parameters:
        - { name: organization_id, in: query, required: false, description: Organization scope; when omitted, it is derived from project_id or the caller's first active membership with owner membership preferred., schema: { type: string, format: uuid } }
        - { name: project_id, in: query, required: false, description: Project scope for API Key, call, and usage evidence; when omitted, the first active project in the selected organization is used., schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Server-derived progress; there is no client-write completion endpoint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/funnel/summary:
    get:
      tags: [Funnel, Admin]
      summary: Read aggregate UTC conversion counts
      operationId: getAdminFunnelSummary
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Aggregate counts without anonymous identifiers or user-level data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FunnelSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/admin/public/commercial-terms:
    get:
      tags: [Public Commercial, Admin]
      summary: List immutable commercial disclosure evidence
      operationId: listAdminPublicCommercialTerms
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Effective-dated disclosure evidence list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicCommercialTermsList' }
    post:
      tags: [Public Commercial, Admin]
      summary: Append an audited, idempotent commercial disclosure version
      operationId: publishAdminPublicCommercialTerms
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: false, description: Required here or in the body., schema: { type: string, minLength: 1, maxLength: 200 } }
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishCommercialTerms' }
      responses:
        '200':
          description: Exact replay of the previously published version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishCommercialTermsResult' }
        '201':
          description: New immutable disclosure version and audit record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishCommercialTermsResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Idempotency key was reused with a different payload }
  /api/admin/public/payment-fees:
    get:
      tags: [Public Commercial, Admin]
      summary: List immutable public payment/platform fee evidence
      operationId: listAdminPublicPaymentFees
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Effective-dated fee evidence list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicPaymentFeeList' }
    post:
      tags: [Public Commercial, Admin]
      summary: Append an audited, idempotent payment/platform fee version
      operationId: publishAdminPublicPaymentFee
      security: [{ adminSessionCookie: [] }, { controlBearer: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: false, description: Required here or in the body., schema: { type: string, minLength: 1, maxLength: 200 } }
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishPaymentFee' }
      responses:
        '200':
          description: Exact replay of the previously published version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishPaymentFeeResult' }
        '201':
          description: New immutable fee version and audit record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishPaymentFeeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Idempotency key was reused with a different payload }
  /api/admin/risk/events:
    get:
      tags: [Governance, Admin]
      summary: List risk events
      responses: { '200': { description: Risk event queue } }
    post:
      tags: [Governance, Admin]
      summary: Record an idempotent risk event
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RiskEvent' } } } }
      responses: { '201': { description: Risk event recorded } }
  /api/admin/risk/{subjectType}/{subjectID}:
    patch:
      tags: [Governance, Admin]
      summary: Update a user or organization risk profile
      responses: { '204': { description: Updated and audited } }
  /api/admin/api-keys/leak-check:
    post:
      tags: [Governance, Admin]
      summary: Check a reported key and freeze it on a match
      responses: { '200': { description: Detection result without returning key material } }
  /api/admin/api-keys/{keyID}/freeze:
    post:
      tags: [Governance, Admin]
      summary: Freeze an API key and revoke all active versions
      responses: { '204': { description: Frozen and audited } }
  /api/admin/content-policies:
    get: { tags: [Governance, Admin], summary: List content policies, responses: { '200': { description: Policies } } }
    post: { tags: [Governance, Admin], summary: Create a legally reviewed content policy, responses: { '201': { description: Policy } } }
  /api/admin/manual-reviews:
    get: { tags: [Governance, Admin], summary: List manual review queue, responses: { '200': { description: Review queue } } }
  /api/admin/manual-reviews/{id}:
    patch: { tags: [Governance, Admin], summary: Resolve or assign a manual review, responses: { '204': { description: Updated and audited } } }
  /api/admin/reports:
    get: { tags: [Governance, Admin], summary: List reports, responses: { '200': { description: Reports } } }
  /api/admin/reports/{id}:
    patch: { tags: [Governance, Admin], summary: Update report status, responses: { '204': { description: Updated } } }
  /api/admin/lifecycle/jobs:
    get: { tags: [Governance, Admin], summary: List privacy lifecycle jobs, responses: { '200': { description: Jobs } } }
  /api/console/reports:
    get: { tags: [Governance, Console], summary: List reports submitted by the authenticated user, responses: { '200': { description: Reports } } }
    post: { tags: [Governance, Console], summary: Submit a report or complaint, responses: { '201': { description: Report } } }
  /api/console/auth/me:
    get: { tags: [Governance, Console], summary: Return the authenticated console user, responses: { '200': { description: Current user } } }
  /api/console/privacy/{subjectType}/{subjectID}:
    get: { tags: [Governance, Console], summary: Read privacy settings, responses: { '200': { description: Settings } } }
    put: { tags: [Governance, Console], summary: Update privacy settings, responses: { '200': { description: Settings } } }
  /api/console/privacy/{subjectType}/{subjectID}/jobs:
    get: { tags: [Governance, Console], summary: List privacy lifecycle requests, responses: { '200': { description: Lifecycle jobs } } }
    post: { tags: [Governance, Console], summary: Request export, close, delete, or purge, responses: { '202': { description: Lifecycle job } } }
  /api/console/privacy/jobs/{jobID}/export:
    get: { tags: [Governance, Console], summary: Download a completed user data export, responses: { '200': { description: Redacted subject export } } }
  /api/console/organizations/{organizationID}/finance/balance:
    get:
      tags: [Finance, Console]
      summary: Get exact cash, non-refundable bonus, and credit composition
      operationId: getConsoleFinanceBalance
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200': { description: Exact decimal balance composition }
  /api/console/organizations/{organizationID}/finance/usage:
    get:
      tags: [Finance, Console]
      summary: List Token charges linked to Provider requests
      operationId: listConsoleFinanceUsage
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200': { description: Request-level charge and Provider trace rows }
  /api/console/organizations/{organizationID}/finance/monthly-statements:
    get:
      tags: [Finance, Console]
      summary: List monthly customer statements
      operationId: listConsoleMonthlyStatements
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200': { description: Monthly exact-decimal statements }
  /api/console/organizations/{organizationID}/refund-applications:
    get:
      tags: [Finance, Console]
      summary: List refund applications
      operationId: listConsoleRefundApplications
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Refund applications with separated eligibility amounts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundApplicationList' }
    post:
      tags: [Finance, Console]
      summary: Apply for a reviewed refund
      operationId: createConsoleRefundApplication
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundApplicationCreate' }
      responses:
        '201':
          description: Durable refund application; this is not payment-provider confirmation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundApplication' }
  /api/console/organizations/{organizationID}/invoice-applications:
    get:
      tags: [Finance, Console]
      summary: List invoice applications
      description: This API exposes application and status only; it does not issue a tax invoice.
      operationId: listConsoleInvoiceApplications
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Invoice applications
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceApplicationList' }
    post:
      tags: [Finance, Console]
      summary: Apply against exact eligible settled sources
      description: No tax system is connected and no automatic invoice is issued.
      operationId: createConsoleInvoiceApplication
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceApplicationCreate' }
      responses:
        '201':
          description: Source-attributed invoice application
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceApplication' }
  /api/console/organizations/{organizationID}/finance/export:
    get:
      tags: [Finance, Console]
      summary: Download a formula-neutralized finance CSV
      operationId: exportConsoleFinanceCSV
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200': { description: UTF-8 CSV download }
  /api/admin/finance/payment-orders:
    get:
      tags: [Finance, Admin]
      summary: Query payment orders
      operationId: listFinancePaymentOrders
      responses:
        '200': { description: Payment orders }
  /api/admin/finance/anomalous-orders:
    get:
      tags: [Finance, Admin]
      summary: Query anomalous payment orders
      operationId: listFinancePaymentAnomalies
      responses:
        '200': { description: Payment anomaly queue }
  /api/admin/finance/ledger-entries:
    get:
      tags: [Finance, Admin]
      summary: Query immutable wallet journal entries
      operationId: listFinanceLedgerEntries
      responses:
        '200': { description: Accounting rows }
  /api/admin/finance/refund-applications:
    get:
      tags: [Finance, Admin]
      summary: Query refund applications
      operationId: listFinanceRefundApplications
      responses:
        '200':
          description: Refund approval queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundApplicationList' }
  /api/admin/finance/refund-applications/{applicationID}/decision:
    post:
      tags: [Finance, Admin]
      summary: Approve or reject a refund application with reason
      operationId: decideFinanceRefundApplication
      parameters:
        - { name: applicationID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinanceDecision' }
      responses:
        '200': { description: Reviewed application }
  /api/admin/finance/refund-applications/{applicationID}/process:
    post:
      tags: [Finance, Admin]
      summary: Complete an approved manual-transfer recharge refund with evidence
      description: Other providers require a verified adapter result; subscription applications cannot be falsely completed here.
      operationId: processFinanceRefundApplication
      parameters:
        - { name: applicationID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: false, description: Required here or in the request body., schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evidence_reference]
              properties:
                evidence_reference: { type: string, minLength: 3, maxLength: 200 }
                idempotency_key: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Linked refund order, wallet debit, journal, cash-lot allocation, and completed application
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RefundOrder' }
                  replayed: { type: boolean }
  /api/admin/finance/invoice-applications:
    get:
      tags: [Finance, Admin]
      summary: Query invoice applications
      operationId: listFinanceInvoiceApplications
      responses:
        '200':
          description: Invoice processing queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceApplicationList' }
  /api/admin/finance/invoice-applications/{applicationID}/decision:
    post:
      tags: [Finance, Admin]
      summary: Approve or reject an invoice application with reason
      operationId: decideFinanceInvoiceApplication
      parameters:
        - { name: applicationID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinanceDecision' }
      responses:
        '200': { description: Reviewed invoice application; no tax invoice is issued }
  /api/admin/finance/invoice-applications/export:
    get:
      tags: [Finance, Admin]
      summary: Export approved invoice applications and mark the exported set
      description: Atomically persists the exact formula-neutralized CSV artifact and transitions only its approved applications to EXPORTED. Retrying the same batch key and filter returns byte-identical content after a disconnected response. This does not issue a tax invoice.
      operationId: exportFinanceInvoiceApplications
      parameters:
        - { name: organization_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100000, default: 1000 } }
        - { name: Idempotency-Key, in: header, required: false, description: Required here or as batch_key; reuse it with the identical filter to retrieve the exact persisted artifact., schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: batch_key, in: query, required: false, description: Compatibility alternative to Idempotency-Key., schema: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        '200':
          description: Persisted UTF-8 CSV of the atomically exported applications
          headers:
            X-RelayDock-Export-Batch-ID: { schema: { type: string, format: uuid } }
            X-RelayDock-Artifact-SHA256: { schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
            X-Idempotent-Replay: { schema: { type: boolean } }
          content:
            text/csv:
              schema: { type: string }
  /api/admin/finance/reports:
    get:
      tags: [Finance, Admin]
      summary: Get Provider cost, user revenue, or gross margin report
      operationId: getFinanceReport
      parameters:
        - { name: report, in: query, required: true, schema: { type: string, enum: [provider_cost, user_revenue, gross_margin] } }
      responses:
        '200':
          description: Exact-decimal daily rows. Provider cost uses statement-line usage dates; user revenue uses posted income-account net credits. Gross margin converts uniquely matched statement cost with the request's immutable pricing-snapshot exchange rate. Missing, ambiguous, or inconsistent evidence is returned as positive unallocated_cost in the Provider currency and is not gross margin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceReportList' }
  /api/admin/finance/accounting-export:
    get:
      tags: [Finance, Admin]
      summary: Export formula-neutralized double-entry accounting CSV
      operationId: exportFinanceAccounting
      responses:
        '200': { description: Formula-neutralized UTF-8 CSV, bounded to 100000 rows; split high-volume exports into narrower half-open UTC date intervals. }
  /api/admin/finance/provider-statements:
    post:
      tags: [Finance, Admin]
      summary: Import immutable Provider billing evidence
      operationId: importFinanceProviderStatement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderStatementImport' }
      responses:
        '201':
          description: Imported statement, immutable lines, and balanced Provider expense/payable journal for an enabled contracted Provider and allowed regions. Exact payload retries return replayed=true; changed payloads conflict.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderStatementImportResult' }
  /api/admin/finance/reconciliation/runs:
    get:
      tags: [Finance, Admin]
      summary: List daily reconciliation runs
      operationId: listFinanceReconciliationRuns
      responses:
        '200': { description: Reconciliation runs }
    post:
      tags: [Finance, Admin]
      summary: Run a replay-safe reconciliation for one UTC business date
      operationId: runFinanceReconciliation
      responses:
        '200': { description: New or replayed durable run }
  /api/admin/finance/reconciliation/cases:
    get:
      tags: [Finance, Admin]
      summary: List classified reconciliation differences
      operationId: listFinanceReconciliationCases
      responses:
        '200': { description: Durable pending queue }
  /api/admin/finance/reconciliation/cases/{caseID}/resolve:
    post:
      tags: [Finance, Admin]
      summary: Accept an exception or post a linked reversal
      operationId: resolveFinanceReconciliationCase
      parameters:
        - { name: caseID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Attributed resolution with reason and idempotency key }
  /status:
    get:
      tags: [Operations]
      summary: Public privacy-safe service status
      operationId: getPublicStatus
      security: []
      responses:
        '200': { description: Gateway, Dashboard, Billing, Provider, and public incident status }
  /api/status:
    get:
      tags: [Operations]
      summary: Compatibility alias for public service status
      operationId: getPublicAPIStatus
      security: []
      responses:
        '200': { description: Public-safe service status }
  /api/admin/observability:
    get:
      tags: [Operations, Admin]
      summary: Read current metric evidence and SLO definitions
      operationId: getAdminObservability
      responses:
        '200': { description: In-process metrics snapshot and exact-decimal SLO targets }
  /api/admin/observability/requests/{requestID}:
    get:
      tags: [Operations, Admin]
      summary: Investigate one request across routing, usage, funding, and ledger evidence
      operationId: investigateAdminRequest
      parameters:
        - { name: requestID, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        '200':
          description: Correlated request evidence; all money fields are exact decimal strings
        '404': { description: Request ID not found }
  /api/admin/status/summary:
    get:
      tags: [Operations, Admin]
      summary: Read service status summary
      responses: { '200': { description: Status summary } }
  /api/admin/status/events:
    get:
      tags: [Operations, Admin]
      summary: List public status events including internal metadata
      responses: { '200': { description: Status event list } }
    post:
      tags: [Operations, Admin]
      summary: Publish an audited public status event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [component, status, summary, public_message]
              properties:
                component: { type: string, enum: [GATEWAY, DASHBOARD, BILLING, PROVIDER, DATABASE, REDIS, PAYMENTS, LEDGER] }
                status: { type: string, enum: [OPERATIONAL, DEGRADED, PARTIAL_OUTAGE, MAJOR_OUTAGE, MAINTENANCE] }
                summary: { type: string, minLength: 1 }
                public_message: { type: string, minLength: 1 }
                dedupe_key: { type: string }
                metadata: { type: object, additionalProperties: true }
      responses: { '201': { description: Status event created and audited } }
  /api/admin/status/events/{id}/resolve:
    post:
      tags: [Operations, Admin]
      summary: Resolve and audit a status event
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '204': { description: Resolved } }
  /api/console/status:
    get:
      tags: [Operations, Console]
      summary: Read authenticated console service status
      responses: { '200': { description: Public-safe status summary } }
  /api/admin/support/tickets:
    get:
