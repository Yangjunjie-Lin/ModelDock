        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/providers/{id}/sync-models:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Admin]
      summary: Synchronize models through one authorized credential
      operationId: syncProviderModels
