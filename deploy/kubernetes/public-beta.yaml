apiVersion: v1
kind: Namespace
metadata:
  name: modeldock
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: modeldock
  namespace: modeldock
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: modeldock-runtime
  namespace: modeldock
data:
  GATEWAY_ADDR: ":8080"
  CONTROL_ADDR: ":8081"
  RELAYDOCK_MIGRATION_MODE: external
  POSTGRES_MAX_CONNS: "20"
  POSTGRES_MIN_CONNS: "2"
  REDIS_POOL_SIZE: "20"
  REDIS_MIN_IDLE_CONNS: "2"
  COOKIE_SECURE: "true"
  RELAYDOCK_ADMIN_MFA_REQUIRED: "true"
  RELAYDOCK_PUBLIC_FUNNEL_RATE_LIMIT: "120"
  RELAYDOCK_PUBLIC_SUPPORT_EMAIL: "support@example.invalid"
  RELAYDOCK_PUBLIC_ENTERPRISE_EMAIL: "enterprise@example.invalid"
  RELAYDOCK_PROVIDER_ALLOW_HTTP: "false"
  RELAYDOCK_PROVIDER_ALLOW_PRIVATE_NETWORK: "false"
  RELAYDOCK_STREAM_MAX_BYTES: "67108864"
  MAX_REQUEST_BODY_BYTES: "10485760"
  RELAYDOCK_DRAIN_DELAY: "15s"
  SHUTDOWN_TIMEOUT: "90s"
  LOG_PROMPT_CONTENT: "false"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: modeldock-migration
  namespace: modeldock
  labels:
    app.kubernetes.io/name: modeldock
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: modeldock
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      serviceAccountName: modeldock
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: modeldock/server:production
          args: ["migrate"]
          envFrom:
            - secretRef: { name: modeldock-runtime-secrets }
          env:
            - { name: POSTGRES_MAX_CONNS, value: "4" }
            - { name: POSTGRES_MIN_CONNS, value: "1" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modeldock
  namespace: modeldock
  labels: { app.kubernetes.io/name: modeldock }
spec:
  replicas: 2
  minReadySeconds: 15
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: modeldock, app.kubernetes.io/component: server }
  template:
    metadata:
      labels: { app.kubernetes.io/name: modeldock, app.kubernetes.io/component: server }
    spec:
      serviceAccountName: modeldock
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: server
          image: modeldock/server:production
          ports:
            - { name: gateway, containerPort: 8080 }
            - { name: control, containerPort: 8081 }
          envFrom:
            - configMapRef: { name: modeldock-runtime }
            - secretRef: { name: modeldock-runtime-secrets }
          startupProbe:
            httpGet: { path: /startupz, port: gateway }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /readyz, port: gateway }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: gateway }
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["/bin/sh", "-c", "sleep 15"] }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: modeldock-gateway
  namespace: modeldock
spec:
  selector: { app.kubernetes.io/name: modeldock, app.kubernetes.io/component: server }
  ports:
    - { name: https-upstream, port: 8080, targetPort: gateway }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: modeldock
  namespace: modeldock
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: modeldock, app.kubernetes.io/component: server }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: modeldock-runtime-connectivity
  namespace: modeldock
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6379 }
        - { protocol: TCP, port: 587 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: modeldock
  namespace: modeldock
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.example.invalid]
      secretName: modeldock-tls
  rules:
    - host: api.example.invalid
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service: { name: modeldock-gateway, port: { number: 8080 } }
