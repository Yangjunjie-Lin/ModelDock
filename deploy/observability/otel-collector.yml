receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: modeldock
          scrape_interval: 15s
          static_configs:
            - targets: [relaydock:8081]

processors:
  batch: {}
  memory_limiter:
    check_interval: 5s
    limit_mib: 192

exporters:
  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [prometheus]
      processors: [memory_limiter, batch]
      exporters: [debug]
