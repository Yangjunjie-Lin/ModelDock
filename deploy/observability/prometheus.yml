global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/modeldock-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: modeldock
    metrics_path: /metrics
    static_configs:
      - targets: [relaydock:8081]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
